<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKSHA MEESHO PICKS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-10 p-4 text-center">
    <h1 class="text-2xl font-extrabold text-pink-600 tracking-wide">AKSHA MEESHO PICKS</h1>
    <p class="text-xs text-gray-500 mt-1">Tap any product below to shop directly on Meesho</p>
    
    <!-- Search Bar -->
    <div class="max-w-md mx-auto mt-3">
      <input 
        type="text" 
        id="searchInput" 
        onkeyup="filterProducts()" 
        placeholder="Search by Product Code (e.g. #01) or Name..." 
        class="w-full px-4 py-2 text-sm border border-pink-200 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-500"
      />
    </div>
  </header>

  <!-- Product Grid -->
  <main class="max-w-4xl mx-auto p-4">
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <!-- Products ikkada auto-load avuthayi -->
    </div>
  </main>

  <script>
    // IKKADA MEE PRODUCTS ADD CHEYANDI (Kottha product kosam oka {...} block copy chesi paina paste cheyandi)
    const products = [
      {
        code: "#01",
        title: "Floral Georgette Anarkali Kurti",
        price: "₹449",
        image: "https://via.placeholder.com/300x350?text=Product+01",
        link: "https://www.meesho.com/"
      },
      {
        code: "#02",
        title: "Gold Plated Jhumka Earrings Set",
        price: "₹189",
        image: "https://via.placeholder.com/300x350?text=Product+02",
        link: "https://www.meesho.com/"
      },
      {
        code: "#03",
        title: "Aesthetic Ceramic Vase Set",
        price: "₹299",
        image: "https://via.placeholder.com/300x350?text=Product+03",
        link: "https://www.meesho.com/"
      }
    ];

    const grid = document.getElementById("productGrid");

    function renderProducts(list) {
      grid.innerHTML = "";
      list.forEach(item => {
        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between border border-pink-100">
            <div class="relative">
              <img src="${item.image}" alt="${item.title}" class="w-full h-48 object-cover" />
              <span class="absolute top-2 left-2 bg-pink-600 text-white text-xs font-bold px-2 py-1 rounded-md shadow">
                ${item.code}
              </span>
            </div>
            <div class="p-3 flex flex-col flex-grow justify-between">
              <div>
                <h2 class="text-sm font-semibold text-gray-800 line-clamp-2">${item.title}</h2>
                <p class="text-pink-600 font-bold text-sm mt-1">${item.price}</p>
              </div>
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                 class="mt-3 block text-center bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition">
                Buy Now
              </a>
            </div>
          </div>
        `;
      });
    }

    function filterProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = products.filter(p => 
        p.code.toLowerCase().includes(query) || 
        p.title.toLowerCase().includes(query)
      );
      renderProducts(filtered);
    }

    renderProducts(products);
  </script>
</body>
</html>
